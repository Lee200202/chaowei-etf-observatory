name: Verify published market freshness
on:
  workflow_run:
    workflows: ['Deploy ETF observatory', 'Refresh bank static backup']
    types: [completed]
  schedule:
    # Independent of the refresh runner: verify actual public responses at 10:15 and 22:15 Taipei.
    - cron: '15 2,14 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          ref: main
      - uses: actions/setup-node@v4
        timeout-minutes: 3
        with:
          node-version: '24'
      - name: Replay session-boundary regression cases
        run: node scripts/test-market-session-health.mjs
      - run: node scripts/verify-market-freshness.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-market-freshness-${{ github.run_id }}
          path: action-health/
          retention-days: 30
