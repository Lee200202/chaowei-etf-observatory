name: Deploy ETF observatory

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  schedule:
    # 18:30 Asia/Taipei, after the Taiwan market close.
    - cron: '30 10 * * 1-5'
    # 06:30 Asia/Taipei, after the US close: Cboe VIX and Yahoo BZ=F daily closes for the session just ended.
    - cron: '30 22 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  # Build and upload in one job, deploy in another: deploy-pages looks the artifact up through the API, and a lookup
  # in the same job right after the upload can miss it ("No artifacts named github-pages were found").
  build:
    runs-on: ubuntu-latest
    steps:
      # Always the newest main: a run that waited in the concurrency queue must not publish an older checkout.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh ETF catalogue
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm run catalog:update
      - name: Append TWSE daily history (ETF K lines and market turnover)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run history:update
      - name: Append intraday turnover profile (same-time volume comparison)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm run intraday:update
      - name: Refresh ETF cash dividends
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm run dividends:update
      - name: Refresh ETF institutional trading and foreign ownership
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm run chips:update
      - name: Append market-wide margin balance
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm run margin:update -- --older 250
      - name: Append TDCC weekly ETF ownership distribution
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm run holders:update
      - name: Refresh official daily snapshots
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm run snapshots:update
      - name: Append Brent futures near-month settlement (FinMind / TAIFEX BRF)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm run brent:update
      - name: Update Brent daily closes (Yahoo Finance BZ=F)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/update-oil-spot.mjs
      - name: Refresh Cboe VIX daily closes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/update-vix.mjs
      - run: npm run history:validate
      - run: npm run build:pages
      - run: npm run build:gas
      - run: npm run test:upgrade
      - run: npm run test:gas
      - name: Save refreshed snapshots
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git add pages-data docs worker/etf-catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Daily snapshot: TWSE history, catalogue, TAIFEX BRF and CBC'
          # Someone may have pushed while the data steps ran: rebase onto the remote and retry a few times.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main; then git push origin HEAD:main && exit 0; else git rebase --abort || true; fi
            echo "push attempt $attempt failed; retrying"; sleep 10
          done
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # One retry after a short wait covers a slow artifact registration or a transient Pages API error.
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
