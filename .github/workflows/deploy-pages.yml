name: Deploy ETF observatory

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  schedule:
    # 18:30 Asia/Taipei, after the Taiwan market close.
    - cron: '30 10 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh ETF catalogue
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm run catalog:update
      - name: Append TWSE daily history (ETF K lines and market turnover)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run history:update
      - name: Append intraday turnover profile (same-time volume comparison)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm run intraday:update
      - name: Refresh ETF cash dividends
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm run dividends:update
      - name: Refresh ETF institutional trading and foreign ownership
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm run chips:update
      - name: Append market-wide margin balance
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm run margin:update -- --older 250
      - name: Append TDCC weekly ETF ownership distribution
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm run holders:update
      - name: Refresh official daily snapshots
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm run snapshots:update
      - run: npm run history:validate
      - run: npm run build:pages
      - name: Save refreshed snapshots
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git add pages-data docs worker/etf-catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Daily snapshot: TWSE history, catalogue, EIA and CBC'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
