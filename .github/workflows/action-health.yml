name: Action failure diagnostics
on:
  workflow_run:
    workflows: ['Deploy ETF observatory', 'Refresh TAIFEX PCR and retail ratio', 'Refresh and verify VIX', 'Verify published market freshness']
    types: [completed]
permissions:
  contents: read
  checks: read
  actions: write
jobs:
  diagnose:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Trusted main only. No artifact or code from the triggering run is executed.
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          ref: main
      - uses: actions/github-script@v7
        timeout-minutes: 5
        with:
          script: |
            const {collectActionHealth} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/action-health.mjs`);
            await collectActionHealth({github,context,core});
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: action-health-${{ github.event.workflow_run.id }}-attempt-${{ github.event.workflow_run.run_attempt }}
          path: action-health/
          retention-days: 30
